# Publishes the web app (./web) as a static site so the Xbox's Edge browser can open it.
# Manual only: run it from the Actions tab AFTER enabling Settings > Pages > Source: "GitHub Actions".
# NOTE: GitHub Pages for a *private* repository needs a paid GitHub plan. The site itself is public (it only contains
# demo data - no keys, no real catalogue). See "Martin Instructions.md" for free alternatives.
name: Publish web app

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: npm test
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
